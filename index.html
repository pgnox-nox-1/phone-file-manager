<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phone Remote Control Panel</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 800px; margin: auto; }
        .status { padding: 8px 12px; border-radius: 5px; font-weight: bold; display: inline-block; }
        .online { background: #10b981; color: white; }
        .offline { background: #f59e0b; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-down { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .folder-link { color: #38bdf8; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Phone Remote Control Panel</h2>
        <p>Status: <span id="status" class="status offline">Waiting for Phone...</span></p>
        <p>Current Path: <b id="current-path">/sdcard</b></p>
        
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="file-list">
                <tr><td colspan="4">Waiting for mobile connection...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();
        let currentPath = '/sdcard';

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('response_file_list', (data) => {
            document.getElementById('status').className = 'status online';
            document.getElementById('status').innerText = 'Mobile Connected Live!';
            
            if(data.current_path) {
                currentPath = data.current_path;
                document.getElementById('current-path').innerText = currentPath;
            }

            const tbody = document.getElementById('file-list');
            tbody.innerHTML = '';

            // Back button if inside a subfolder
            if (currentPath !== '/sdcard') {
                const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/sdcard';
                tbody.innerHTML += `
                    <tr>
                        <td colspan="4" class="folder-link" onclick="openFolder('${parentPath}')">📁 .. (Go Back)</td>
                    </tr>`;
            }

            if (!data.files || data.files.length === 0) {
                tbody.innerHTML += '<tr><td colspan="4">Empty Folder</td></tr>';
                return;
            }

            data.files.forEach(file => {
                const tr = document.createElement('tr');
                if (file.is_dir) {
                    tr.innerHTML = `
                        <td class="folder-link" onclick="openFolder('${file.path.replace(/\\/g, '/')}')">📁 ${file.name}</td>
                        <td>Folder</td>
                        <td>-</td>
                        <td><button class="btn-del" onclick="deleteItem('${file.path.replace(/\\/g, '/')}')">Delete</button></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>📄 ${file.name}</td>
                        <td>File</td>
                        <td>${file.size}</td>
                        <td>
                            <button class="btn-down" onclick="downloadFile('${file.path.replace(/\\/g, '/')}')">Download</button>
                            <button class="btn-del" onclick="deleteItem('${file.path.replace(/\\/g, '/')}')">Delete</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        });

        socket.on('response_download', (data) => {
            const link = document.createElement('a');
            link.href = 'data:application/octet-stream;base64,' + data.file_data;
            link.download = data.filename;
            link.click();
        });

        function openFolder(path) {
            socket.emit('fetch_file_list', { path: path });
        }

        function deleteItem(path) {
            if (confirm('Are you sure you want to delete this?')) {
                socket.emit('execute_delete', { path: path });
            }
        }

        function downloadFile(path) {
            socket.emit('download_file', { path: path });
        }
    </script>
</body>
</html>
