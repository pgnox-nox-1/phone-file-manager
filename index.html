<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Live Remote Phone Manager</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: inline-block; }
        .on { background: #065f46; color: #34d399; }
        .off { background: #7f1d1d; color: #f87171; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; background: #334155; padding: 12px 15px; border-radius: 8px; margin: 15px 0; }
        .path { font-family: monospace; color: #cbd5e1; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #e2e8f0; font-size: 0.9rem; }
        .folder { color: #38bdf8; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .folder:hover { text-decoration: underline; }
        .file-item { display: flex; align-items: center; gap: 8px; color: #e2e8f0; }
        .btn { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-del { background: #ef4444; color: white; }
        .btn-down { background: #3b82f6; color: white; margin-right: 5px; }
        .btn-upload { background: #10b981; color: white; }
        .upload-section { background: #0f172a; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px dashed #475569; }
        .qr-container { text-align: center; margin-top: 25px; background: #0f172a; padding: 15px; border-radius: 8px; }
        .qr-container img { width: 140px; height: 140px; border-radius: 6px; background: white; padding: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 Advanced Live Remote Phone Manager</h2>
        <div>Connection Status: <span id="status" class="status off">Waiting for Phone...</span></div>
        
        <div class="qr-container">
            <p style="margin: 5px 0 10px 0; font-size: 0.9rem; color: #94a3b8;">Scan this QR code to access storage dashboard remotely:</p>
            <img id="qr-img" src="" alt="QR Code">
            <div><a id="site-url" href="#" target="_blank" style="color: #38bdf8; font-size: 0.85rem; word-break: break-all;"></a></div>
        </div>

        <div class="toolbar">
            <div class="path">Current Path: <b id="current-path">/sdcard</b></div>
        </div>

        <div class="upload-section">
            <h4 style="margin: 0 0 10px 0; color: #e2e8f0;">📤 Transfer / Upload File to Phone</h4>
            <input type="file" id="file-input" style="color: #cbd5e1; margin-bottom: 10px;">
            <br>
            <button class="btn btn-upload" onclick="uploadFile()">Upload File</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="file-list">
                <tr><td colspan="4" style="text-align: center; color: #94a3b8;">Waiting for mobile script to execute...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();
        let currentPath = '/sdcard';

        fetch('/get_qr')
            .then(res => res.json())
            .then(data => {
                document.getElementById('qr-img').src = 'data:image/png;base64,' + data.qr_code;
                const link = document.getElementById('site-url');
                link.href = data.url;
                link.innerText = data.url;
            });

        socket.on('status_update', (data) => {
            const statusEl = document.getElementById('status');
            if (data.status === 'connected') {
                statusEl.className = 'status on';
                statusEl.innerText = 'Phone Connected Live!';
                socket.emit('fetch_file_list', { path: currentPath });
            } else {
                statusEl.className = 'status off';
                statusEl.innerText = 'Waiting for Phone...';
            }
        });

        socket.on('response_file_list', (data) => {
            if(data.current_path) {
                currentPath = data.current_path;
                document.getElementById('current-path').innerText = currentPath;
            }

            const tbody = document.getElementById('file-list');
            tbody.innerHTML = '';

            if (currentPath !== '/sdcard' && currentPath !== '/') {
                const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/sdcard';
                tbody.innerHTML += `<tr><td colspan="4"><span class="folder" onclick="openFolder('${parentPath}')">📁 .. (Go Back)</span></td></tr>`;
            }

            if (!data.files || data.files.length === 0) {
                tbody.innerHTML += '<tr><td colspan="4" style="text-align: center; color: #94a3b8;">This folder is empty</td></tr>';
                return;
            }

            data.files.forEach(file => {
                const tr = document.createElement('tr');
                const cleanPath = file.path.replace(/\\/g, '/');
                const formattedSize = file.is_dir ? '-' : formatBytes(file.size);

                if (file.is_dir) {
                    tr.innerHTML = `
                        <td><span class="folder" onclick="openFolder('${cleanPath}')">📁 ${file.name}</span></td>
                        <td>Folder</td>
                        <td>${formattedSize}</td>
                        <td><button class="btn btn-del" onclick="deleteItem('${cleanPath}')">Delete</button></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td><div class="file-item">📄 ${file.name}</div></td>
                        <td>File</td>
                        <td>${formattedSize}</td>
                        <td>
                            <button class="btn btn-down" onclick="downloadFile('${cleanPath}')">Download</button>
                            <button class="btn btn-del" onclick="deleteItem('${cleanPath}')">Delete</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        });

        socket.on('response_download', (data) => {
            const link = document.createElement('a');
            link.href = 'data:application/octet-stream;base64,' + data.file_data;
            link.download = data.filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        socket.on('response_upload', (data) => {
            alert('File transferred and uploaded successfully!');
            socket.emit('fetch_file_list', { path: data.current_path });
        });

        function openFolder(path) {
            socket.emit('fetch_file_list', { path: path });
        }

        function deleteItem(path) {
            if(confirm('Are you sure you want to delete this item?')) {
                socket.emit('execute_delete', { path: path });
            }
        }

        function downloadFile(path) {
            socket.emit('download_file', { path: path });
        }

        function uploadFile() {
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length === 0) {
                alert('Please select a file to upload first!');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1];
                socket.emit('upload_file_chunk', {
                    path: currentPath,
                    filename: file.name,
                    file_data: base64Data
                });
            };
            reader.readAsDataURL(file);
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
