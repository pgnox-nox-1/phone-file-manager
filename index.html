<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Data Manager</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111827; color: white; margin: 0; padding: 15px; }
        .box { background: #1f2937; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; }
        .status { padding: 6px 12px; border-radius: 4px; font-weight: bold; display: inline-block; }
        .on { background: #10b981; }
        .off { background: #ef4444; }
        .path { background: #374151; padding: 8px; border-radius: 4px; margin: 15px 0; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #374151; }
        .folder { color: #38bdf8; cursor: pointer; font-weight: bold; }
        .btn-del { background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-down { background: #2563eb; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📱 Live Remote Phone Manager</h2>
        <p>Status: <span id="status" class="status off">Waiting for Phone...</span></p>
        <div class="path">Location: <b id="current-path">/sdcard</b></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="file-list">
                <tr><td colspan="3">Waiting for mobile script to run...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();
        let currentPath = '/sdcard';

        socket.on('status_update', (data) => {
            const statusEl = document.getElementById('status');
            if (data.status === 'connected') {
                statusEl.className = 'status on';
                statusEl.innerText = 'Mobile Connected!';
                socket.emit('fetch_file_list', { path: currentPath });
            } else {
                statusEl.className = 'status off';
                statusEl.innerText = 'Waiting for Phone...';
            }
        });

        socket.on('response_file_list', (data) => {
            if(data.current_path) {
                currentPath = data.current_path;
                document.getElementById('current-path').innerText = currentPath;
            }

            const tbody = document.getElementById('file-list');
            tbody.innerHTML = '';

            if (currentPath !== '/sdcard' && currentPath !== '/') {
                const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/sdcard';
                tbody.innerHTML += `<tr><td colspan="3" class="folder" onclick="openFolder('${parentPath}')">⬅️ .. (Go Back)</td></tr>`;
            }

            if (!data.files || data.files.length === 0) {
                tbody.innerHTML += '<tr><td colspan="3">Folder is empty</td></tr>';
                return;
            }

            data.files.forEach(file => {
                const tr = document.createElement('tr');
                const cleanPath = file.path.replace(/\\/g, '/');
                if (file.is_dir) {
                    tr.innerHTML = `
                        <td class="folder" onclick="openFolder('${cleanPath}')">📁 ${file.name}</td>
                        <td>Folder</td>
                        <td><button class="btn-del" onclick="deleteItem('${cleanPath}')">Delete</button></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>📄 ${file.name}</td>
                        <td>File</td>
                        <td>
                            <button class="btn-down" onclick="downloadFile('${cleanPath}')">Download</button>
                            <button class="btn-del" onclick="deleteItem('${cleanPath}')">Delete</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        });

        socket.on('response_download', (data) => {
            const link = document.createElement('a');
            link.href = 'data:application/octet-stream;base64,' + data.file_data;
            link.download = data.filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function openFolder(path) { socket.emit('fetch_file_list', { path: path }); }
        function deleteItem(path) { if(confirm('Delete this item?')) socket.emit('execute_delete', { path: path }); }
        function downloadFile(path) { socket.emit('download_file', { path: path }); }
    </script>
</body>
</html>
