<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Phone Controller</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .qr-box { text-align: center; background: #ffffff; padding: 10px; border-radius: 8px; color: #000; }
        .qr-box img { width: 130px; height: 130px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #94a3b8; }
        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-del { background: #ef4444; color: white; }
        .btn-down { background: #10b981; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 14px; background: #f59e0b; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>Phone Remote Control Panel</h2>
                <p>Status: <span id="status" class="status-badge">Waiting for Phone...</span></p>
            </div>
            <div class="qr-box">
                <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
                <p style="margin: 5px 0 0 0; font-size: 10px;">Scan QR / Open URL</p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="fileList">
                <tr><td colspan="4" style="text-align: center;">Waiting for mobile connection...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log("Connected to Server");
        });

        socket.on('device_status', (data) => {
            if(data.connected) {
                document.getElementById('status').innerText = "Mobile Connected Live!";
                document.getElementById('status').style.background = "#10b981";
                socket.emit('get_files', { path: '/sdcard' });
            }
        });

        socket.on('render_file_list', (data) => {
            const tbody = document.getElementById('fileList');
            tbody.innerHTML = '';
            data.files.forEach(file => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${file.is_dir ? '📁' : '📄'} ${file.name}</td>
                    <td>${file.is_dir ? 'Folder' : 'File'}</td>
                    <td>${file.size}</td>
                    <td>
                        ${!file.is_dir ? `<button class="btn btn-down" onclick="downloadFile('${file.path}')">Download</button>` : ''}
                        <button class="btn btn-del" onclick="deleteFile('${file.path}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });

        function deleteFile(path) {
            if(confirm("Are you sure you want to delete this file from your phone?")) {
                socket.emit('delete_file_request', { path: path });
            }
        }

        function downloadFile(path) {
            alert("Download request sent to mobile...");
            socket.emit('download_file_request', { path: path });
        }
    </script>
</body>
  </html>
