<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Remote Control Panel</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b132b; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1c2541; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #4ea8de; }
        .status-box { padding: 10px 15px; border-radius: 6px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .connected { background: #10b981; color: #fff; }
        .disconnected { background: #f59e0b; color: #fff; }
        .path-bar { background: #3a506b; padding: 10px; border-radius: 6px; font-weight: 500; margin-bottom: 15px; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #3a506b; }
        th { background: #0b132b; color: #4ea8de; }
        tr:hover { background: #2a3a5e; }
        .item-name { cursor: pointer; color: #64dfdf; text-decoration: none; font-weight: 600; }
        .item-name:hover { text-decoration: underline; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-del { background: #e63946; color: white; }
        .btn-down { background: #48cae4; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 Phone Remote Control Panel</h2>
        <div>
            Status: <span id="status" class="status-box disconnected">Waiting for Phone...</span>
        </div>
        <div class="path-bar">📂 Current Path: <span id="current-path">/sdcard</span></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="file-list">
                <tr><td colspan="4">Connecting to device...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const socket = io();
        let currentPath = '/sdcard';

        socket.on('status_update', (data) => {
            const statusEl = document.getElementById('status');
            if (data.status === 'connected') {
                statusEl.className = 'status-box connected';
                statusEl.innerText = 'Mobile Connected Live!';
                socket.emit('fetch_file_list', { path: currentPath });
            } else {
                statusEl.className = 'status-box disconnected';
                statusEl.innerText = 'Waiting for Phone...';
            }
        });

        socket.on('response_file_list', (data) => {
            if(data.current_path) {
                currentPath = data.current_path;
                document.getElementById('current-path').innerText = currentPath;
            }

            const tbody = document.getElementById('file-list');
            tbody.innerHTML = '';

            if (currentPath !== '/sdcard' && currentPath !== '/') {
                const parentPath = currentPath.substring(0, currentPath.lastIndexOf('/')) || '/sdcard';
                tbody.innerHTML += `
                    <tr>
                        <td colspan="4" class="item-name" onclick="openFolder('${parentPath}')">⬅️ .. (Go Back)</td>
                    </tr>`;
            }

            if (!data.files || data.files.length === 0) {
                tbody.innerHTML += '<tr><td colspan="4">Empty Folder</td></tr>';
                return;
            }

            data.files.forEach(file => {
                const tr = document.createElement('tr');
                const cleanPath = file.path.replace(/\\/g, '/');
                if (file.is_dir) {
                    tr.innerHTML = `
                        <td class="item-name" onclick="openFolder('${cleanPath}')">📁 ${file.name}</td>
                        <td>Folder</td>
                        <td>-</td>
                        <td><button class="btn btn-del" onclick="deleteItem('${cleanPath}')">Delete</button></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td>📄 ${file.name}</td>
                        <td>File</td>
                        <td>${file.size}</td>
                        <td>
                            <button class="btn btn-down" onclick="downloadFile('${cleanPath}')">Download</button>
                            <button class="btn btn-del" onclick="deleteItem('${cleanPath}')">Delete</button>
                        </td>
                    `;
                }
                tbody.appendChild(tr);
            });
        });

        socket.on('response_download', (data) => {
            const link = document.createElement('a');
            link.href = 'data:application/octet-stream;base64,' + data.file_data;
            link.download = data.filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function openFolder(path) {
            socket.emit('fetch_file_list', { path: path });
        }

        function deleteItem(path) {
            if (confirm('Are you sure you want to delete this?')) {
                socket.emit('execute_delete', { path: path });
            }
        }

        function downloadFile(path) {
            socket.emit('download_file', { path: path });
        }
    </script>
</body>
    </html>
